name: pull-request-policy
description: Policy as Code for GitHub pull requests. Put a security gate directly in your GitHub delivery path.
author: milaforge
branding:
  icon: check-square
  color: white
inputs:
  config-path:
    description: Path to the policy config file.
    required: false
    default: .github/pull-request-policy.yml
  github-token:
    description: GitHub token used to read the base policy, pull request facts, and governance state.
    required: false
    default: ${{ github.token }}
  fail-on-warn:
    description: Fail the job when warning policies are violated.
    required: false
    default: 'false'
runs:
  using: node20
  main: dist/index.js
