name: pull-request-policy
description: Enforce conditional pull request policies in GitHub Actions using version-controlled YAML rules for changed files, approvals, labels, titles, descriptions, and required documentation.
author: milaforge
branding:
  icon: check-square
  color: white
inputs:
  policy:
    description: Inline YAML policy for quick starts. This takes precedence over config-path and is not protected by base-SHA loading.
    required: false

  config-path:
    description: Path to the policy config file.
    required: false
    default: .github/pull-request-policy.yml
  github-token:
    description: GitHub token used to read the base policy and pull request facts.
    required: false
    default: ${{ github.token }}
  mode:
    description: audit reports violations without failing; enforce fails according to policy severity.
    required: false
    default: enforce
runs:
  using: node20
  main: dist/index.js
