name: published-smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions: {}

jobs:
  published-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: milaforge/pull-request-policy@025b7c153194f0712f91809bfada9fce35057c46 # v0.1-beta
        with:
          github-token: ${{ github.token }}
          config-path: tests/fixtures/self-test/pass.yml

  published-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: pull-request-policy
        continue-on-error: true
        uses: milaforge/pull-request-policy@025b7c153194f0712f91809bfada9fce35057c46 # v0.1-beta
        with:
          github-token: ${{ github.token }}
          config-path: tests/fixtures/self-test/fail.yml
      - if: steps.pull-request-policy.outcome != 'failure'
        run: |
          echo "Expected the published action failure fixture to fail."
          exit 1
